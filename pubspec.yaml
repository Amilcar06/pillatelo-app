name: app_gestion_financiera_personal
description: "Aplicación móvil para gestión financiera personal (gastos, préstamos, ingresos y metas)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Estado y arquitectura
  provider: ^6.1.2

  # Navegación avanzada
  go_router: ^14.2.3

  # Persistencia local
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Cliente HTTP
  dio: ^5.5.0

  # Utilidades
  intl: ^0.19.0

  # UI y estilos
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0

  # Iconos Cupertino
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.3
  sqflite_common_ffi_web: ^1.0.0
  pdf: ^3.11.3
  printing: ^5.14.3
  csv: ^6.0.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  get_it: ^9.2.1
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/logoDark.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
